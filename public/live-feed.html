<!DOCTYPE html>
<html>
<head>
    <title>Live Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="live-feed.css">

</head>
<body>
<header>
    
    <div class="logo">GardenPal</div>

    <nav>
        <button class="navBtn active" data-page="live">Live Feed</button>
        <button class="navBtn" data-page="myplants">My Plants</button>
        <button class="navBtn" data-page="weather">Weather</button>
    </nav>

    <div class="profile"><button class="navBtn" data-page="profile" 
        style="background: transparent; 
        border: none; 
        font-size: 22px;
        cursor: pointer;">👤</button></div>
</header>
<main>
    <section class="camera-section">
        <h2>Live Camera Feed for Plant</h2>
        <p>Motion last detected 10 minutes ago</p>

        <div class="camera-box">
            <img id="feedImage" src="/camera-stream" alt="Live Camera Feed">
        </div>
        <p id="cameraStatus">Camera not connected</p>

    </section>

    <section class="alert">
    <h2>Alerts</h2>
    <div id = "alerts-container"></div>
    </section>

</main>
<div class="footer-strip"></div>

<script>
    const routes = {
        live: "live-feed.html",
        myplants: "myplants.html",
        weather: "weather/weather.html",
        profile: "account.html"
    };
    document.querySelectorAll(".navBtn").forEach(btn =>{
        btn.addEventListener("click", () =>{
            const page = btn.dataset.page;
            window.location.href = routes[page];
        });
    });
</script>

<script>
    const currentPage = window.location.pathname.split("/").pop().replace(".html", "");

    document.querySelectorAll(".navBtn").forEach(btn => {
        if (btn.dataset.page === currentPage){
            btn.classList.add("active");
        }
    });
</script>

<script src="live-feed.js"></script>
</body>
</html>
