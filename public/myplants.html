<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GardenPal Dashboard</title>
    <link rel="stylesheet" href="myplants.css">
    <script src="myplants.js"></script>
</head>

<body>

    <header>
        <div class="logo">GardenPal</div>

        <nav>
            <button class="navBtn" data-page="live">Live Feed</button>
            <button class="navBtn" data-page="myplants">My Plants</button>
            <button class="navBtn" data-page="weather">Weather</button>
        </nav>

        <div class="profile">
            <button class="navBtn" data-page="profile" 
                style="background: transparent; border: none; font-size: 22px; cursor: pointer;">
                👤
            </button>
        </div>
    </header>

        <div class="layout">

            <aside class="sidebar" id="sidebar">

                <div class="sidebar-header">
                    <button class="hamburger" id="toggleSidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <rect y="4" width="24" height="2" rx="1" fill="#333"/>
                            <rect y="11" width="24" height="2" rx="1" fill="#333"/>
                            <rect y="18" width="24" height="2" rx="1" fill="#333"/>
                        </svg>
                    </button>
                    <h3 class="sidebar-title">Garden at a Glance</h3>
                </div>

                <div class="sidebar-card">
                    <h2>Overall Plant Health</h2>
                    <ul class="health-summary">
                        <li class="healthy">0 Healthy</li>
                        <li class="need-water">0 Need Water</li>
                        <li class="at-risk">0 At Risk</li>
                    </ul>
                </div>

                <div class="sidebar-card">
                    <h2>Actions Needed</h2>
                    <ul class="actions">
                        <li>Move Plant #1 and Plant #2 to a sunnier area</li>
                        <li>Water Plant #2</li>
                    </ul>
                </div>

                <div class="sidebar-card">
                    <h2>Last Sensor Update</h2>
                    <p id="last-update">Last update: --</p>
                </div>

            </aside>

            <main class="main">

                <div class="content-box">

                    <div class="main-header">
                        <div>
                            <h1>My Plants</h1>
                            <p class="plants-caption">Live insights from your monitored plants</p>
                        </div>
                        <button class="add-btn" id="addPlantBtn">+ Add Plant</button>
                    </div>

                    <div class="plant-grid" id="plant-grid"></div>

                </div>
            </main>
        </div>

        <footer class="footer"></footer>
    <script>
        const toggleBtn = document.getElementById("toggleSidebar");
        const sidebar = document.getElementById("sidebar");

        toggleBtn.addEventListener("click", () => {
            sidebar.classList.toggle("collapsed");
        });
    </script>

    <script>
        const routes = {
            live: "live-feed.html",
            myplants: "myplants.html",
            weather: "weather/weather.html",
            profile: "account.html"
        };
        document.querySelectorAll(".navBtn").forEach(btn =>{
            btn.addEventListener("click", () =>{
                const page = btn.dataset.page;
                window.location.href = routes[page];
            });
        });
    </script>

    <script>
        const currentPage = window.location.pathname.split("/").pop().replace(".html", "");

        document.querySelectorAll(".navBtn").forEach(btn => {
            if (btn.dataset.page === currentPage){
                btn.classList.add("active");
            }
        });
    </script>


</body>
</html>
