<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your GardenPal Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="account.css">

</head>
<body>
<header>
    
<div class="logo">GardenPal</div>

<nav>
<button class="navBtn" data-page="live">Live Feed</button>
<button class="navBtn" data-page="myplants">My Plants</button>
<button class="navBtn" data-page="weather">Weather</button>
</nav>

<div class="profile"><button class="navBtn" data-page="profile" 
style="background: transparent; 
border: none; 
font-size: 22px;
cursor: pointer;">👤</button></div>
</header>


<section class="profile-wrapper">

<div class="profile-container">

<div class="profile-avatar">👤</div>

<h2 class="username" id="fullname"></h2>


<div class="profile-card">

<div class="row">
  <span class="label">Username: admin</span>
  <span class="value" id="username"></span>
</div>

<div class="row">
  <span class="label">Email: admin@scarletmail.rutgers.edu</span>
  <span class="value" id="email"></span>
</div>

<div class="row">
  <span class="label" id="plant-count">Plant Count: 5</span>
  <span class="value" id="plants"></span>
</div>

<div class="row">
  <span class="label">Location: New Brunswick, New Jersey</span>
  <span class="value" id="location"></span>
</div>

<div class="links">
  <a href="#">Change Password</a>
  <a href="#">Change Email</a>
</div>

</div>

</div>

</section>

</body>
<script>
    const routes = {
        live: "live-feed.html",
        myplants: "myplants.html",
        weather: "weather/weather.html",
        profile: "account.html"
    };
    document.querySelectorAll(".navBtn").forEach(btn =>{
        btn.addEventListener("click", () =>{
            const page = btn.dataset.page;
            window.location.href = routes[page];
        });
    });
</script>

<script>
    const currentPage = window.location.pathname.split("/").pop().replace(".html", "");

    document.querySelectorAll(".navBtn").forEach(btn => {
        if (btn.dataset.page === currentPage){
            btn.classList.add("active");
        }
    });
</script>

<script>
async function loadPlantCount() {
  const response = await fetch("/api/sensor-data");
  const data = await response.json();

  const plantCount = Object.values(data.plants).filter(readings => {
    const latest = readings[readings.length - 1];
    return latest.timestamp !== "Manual default";
  }).length;

  document.getElementById("plant-count").textContent =
    `Plant Count: ${plantCount}`;
}

loadPlantCount();
setInterval(loadPlantCount, 5000);
</script>

</html>
